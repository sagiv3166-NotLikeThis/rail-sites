<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1426">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אתרי רכבת">
<meta name="description" content="ניווט לאתרים תפעוליים">
<title>אתרי רכבת · ניווט לאתרים תפעוליים</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* =========================================================
   TOKENS
   Signal-aspect palette: status is communicated the way a
   railway signal does it — red / amber / green lamps.
   ========================================================= */
:root{
  --font: "Rubik", "Heebo", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;

  --blue: #0A63D6;          /* national rail blue */
  --blue-hi: #3B8BFF;
  --lamp-red: #FF5A5F;
  --lamp-amber: #FFC23D;
  --lamp-green: #36E08A;
  --waze: #33CCFF;
  --waze-ink: #03222E;
  --sos: #E5242E;

  --r-xl: 28px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --nav-h: 72px;
}

:root[data-theme="dark"], :root:not([data-theme]){
  --bg: #0A1426;
  --bg-deep: #060D1A;
  --panel: #111E36;
  --panel-2: #172744;
  --glass: rgba(17,30,54,.72);
  --line: rgba(160,190,235,.13);
  --line-strong: rgba(160,190,235,.26);
  --ink: #F2F6FC;
  --ink-2: #A9B7CE;
  --ink-3: #7486A3;
  --signal-housing: #050A14;
  --lamp-off: #1E2A40;
  --gmaps-bg: #F2F6FC;
  --gmaps-ink: #0A1426;
  --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
  --track: rgba(160,190,235,.09);
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg: #E9EEF5;
  --bg-deep: #DCE3EE;
  --panel: #FFFFFF;
  --panel-2: #F1F5FA;
  --glass: rgba(255,255,255,.82);
  --line: rgba(6,20,43,.12);
  --line-strong: rgba(6,20,43,.24);
  --ink: #06142B;
  --ink-2: #33445F;
  --ink-3: #5A6A83;
  --signal-housing: #0B1322;
  --lamp-off: #2A364C;
  --gmaps-bg: #06142B;
  --gmaps-ink: #FFFFFF;
  --shadow: 0 14px 30px -16px rgba(6,20,43,.35);
  --track: rgba(6,20,43,.07);
  --lamp-green: #0FA35C;
  --lamp-amber: #D98E00;
  --lamp-red: #D9262C;
  color-scheme: light;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.45;
  transition:background-color .4s var(--ease), color .4s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-hi);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Backdrop: faint sleepers/rails running the length of the app */
.backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.backdrop::before{
  content:"";position:absolute;inset:-10% 0;
  background:
    linear-gradient(90deg, transparent calc(50% - 60px), var(--track) calc(50% - 60px), var(--track) calc(50% - 56px), transparent calc(50% - 56px),
                           transparent calc(50% + 56px), var(--track) calc(50% + 56px), var(--track) calc(50% + 60px), transparent calc(50% + 60px)),
    repeating-linear-gradient(180deg, transparent 0 34px, var(--track) 34px 40px);
  -webkit-mask: linear-gradient(90deg, transparent calc(50% - 90px), #000 calc(50% - 90px), #000 calc(50% + 90px), transparent calc(50% + 90px));
          mask: linear-gradient(90deg, transparent calc(50% - 90px), #000 calc(50% - 90px), #000 calc(50% + 90px), transparent calc(50% + 90px));
  opacity:.9;
}
.backdrop::after{
  content:"";position:absolute;width:120vmax;height:120vmax;top:-70vmax;inset-inline-start:-40vmax;
  background:radial-gradient(closest-side, rgba(10,99,214,.35), transparent 70%);
}
:root[data-theme="light"] .backdrop::after{background:radial-gradient(closest-side, rgba(10,99,214,.16), transparent 70%)}

.app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}

/* =========================================================
   HEADER
   ========================================================= */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  padding:14px 18px 12px;
  background:linear-gradient(var(--bg) 55%, transparent);
}
.bar{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand-signal{
  width:30px;height:56px;border-radius:15px;background:var(--signal-housing);
  display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.07), 0 6px 16px -6px rgba(0,0,0,.6);flex:none;
}
.brand-signal i{width:12px;height:12px;border-radius:50%;background:var(--lamp-off);transition:background .25s, box-shadow .25s}
.brand-signal i.on-r{background:var(--lamp-red);box-shadow:0 0 12px var(--lamp-red)}
.brand-signal i.on-a{background:var(--lamp-amber);box-shadow:0 0 12px var(--lamp-amber)}
.brand-signal i.on-g{background:var(--lamp-green);box-shadow:0 0 14px var(--lamp-green)}
.brand h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.brand p{font-size:.86rem;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.icon-btn{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  transition:transform .2s var(--spring), background .2s, border-color .2s;
}
.icon-btn:active{transform:scale(.9)}
.icon-btn.lang{font-weight:700;font-size:.9rem}
.icon-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* Search */
.search{
  margin-top:14px;display:flex;align-items:center;gap:10px;height:56px;padding-inline:16px 8px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1.5px solid var(--line-strong);border-radius:18px;
  transition:border-color .2s, box-shadow .25s;
}
.search:focus-within{border-color:var(--blue-hi);box-shadow:0 0 0 4px rgba(59,139,255,.2)}
.search svg{color:var(--ink-3)}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:1.05rem;font-weight:500}
.search input::placeholder{color:var(--ink-3);font-weight:400}
.search input::-webkit-search-cancel-button{display:none}
.clear-btn{width:40px;height:40px;border-radius:12px;display:none;place-items:center;color:var(--ink-2)}
.search.has-text .clear-btn{display:grid}
.filter-toggle{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);transition:background .2s,color .2s}
.filter-toggle[aria-expanded="true"]{background:var(--blue);color:#fff}
.filter-toggle .dot{position:absolute;top:8px;inset-inline-end:8px;width:9px;height:9px;border-radius:50%;background:var(--lamp-amber);border:2px solid var(--panel);display:none}
.filter-toggle.has-filters .dot{display:block}

/* Filters */
.filters{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.filters.open{grid-template-rows:1fr}
.filters > div{overflow:hidden}
.f-group{padding-top:12px}
.f-label{font-size:.8rem;font-weight:600;color:var(--ink-3);margin-bottom:8px;padding-inline:2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:40px;padding-inline:16px;border-radius:999px;font-size:.92rem;font-weight:600;
  background:var(--panel);border:1.5px solid var(--line);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:7px;transition:all .2s var(--ease);
}
.chip .sw{width:10px;height:10px;border-radius:3px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:active{transform:scale(.95)}

/* Toolbar under search */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.count{font-size:.92rem;color:var(--ink-2)}
.count b{color:var(--ink);font-weight:700}
.sort{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;position:relative}
.sort button{height:34px;padding-inline:12px;border-radius:9px;font-size:.85rem;font-weight:600;color:var(--ink-2);position:relative;z-index:1;transition:color .2s;display:flex;align-items:center;gap:5px}
.sort button[aria-pressed="true"]{color:#fff}
.sort .pill{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--blue);transition:all .35s var(--spring)}

/* Offline strip */
.offline{margin:0 18px 10px;padding:10px 14px;border-radius:12px;background:rgba(255,194,61,.14);border:1px solid rgba(255,194,61,.4);color:var(--ink);font-size:.88rem;font-weight:500;display:none;align-items:center;gap:8px}
.offline.show{display:flex}

/* =========================================================
   LIST + CARDS
   ========================================================= */
.list{padding:6px 18px 0;display:flex;flex-direction:column;gap:14px}
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);overflow:hidden;
}
.card-main{display:flex;gap:14px;padding:16px 16px 14px;width:100%;text-align:start;align-items:flex-start}
.card-main:active{background:var(--panel-2)}

/* The signal head — status at a glance */
.sig{
  flex:none;width:26px;padding:5px 0;border-radius:13px;background:var(--signal-housing);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.06);
}
.sig i{width:12px;height:12px;border-radius:50%;background:var(--lamp-off)}
.sig[data-s="clearance"] i:nth-child(1){background:var(--lamp-red);box-shadow:0 0 10px var(--lamp-red)}
.sig[data-s="active"] i:nth-child(2){background:var(--lamp-amber);box-shadow:0 0 10px var(--lamp-amber);animation:blink 1.6s ease-in-out infinite}
.sig[data-s="safe"] i:nth-child(3){background:var(--lamp-green);box-shadow:0 0 10px var(--lamp-green)}
@keyframes blink{50%{opacity:.35;box-shadow:none}}

.c-body{flex:1;min-width:0}
.c-title{font-size:1.14rem;font-weight:700;line-height:1.25;letter-spacing:-.005em}
.c-title mark{background:rgba(59,139,255,.28);color:inherit;border-radius:4px;padding:0 2px}
.c-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px;font-size:.9rem;color:var(--ink-2)}
.type{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.type svg{width:16px;height:16px}
.sep{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.status{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:28px;padding-inline:10px;border-radius:8px;
  font-size:.82rem;font-weight:700;
}
.status[data-s="active"]{background:rgba(255,194,61,.15);color:var(--lamp-amber)}
.status[data-s="clearance"]{background:rgba(255,90,95,.14);color:var(--lamp-red)}
.status[data-s="safe"]{background:rgba(54,224,138,.13);color:var(--lamp-green)}
:root[data-theme="light"] .status[data-s="active"]{color:#8A5A00}
:root[data-theme="light"] .status[data-s="clearance"]{color:#B11419}
:root[data-theme="light"] .status[data-s="safe"]{color:#08703E}
.dist{margin-inline-start:6px;font-size:.84rem;font-weight:600;color:var(--ink-2)}

.fav{
  width:44px;height:44px;margin:-6px -6px 0 0;border-radius:12px;display:grid;place-items:center;color:var(--ink-3);flex:none;
  transition:transform .3s var(--spring), color .2s;
}
[dir="ltr"] .fav{margin:-6px -6px 0 0}
[dir="rtl"] .fav{margin:-6px 0 0 -6px}
.fav[aria-pressed="true"]{color:var(--lamp-amber)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.fav.pop{animation:pop .45s var(--spring)}
@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}

.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.nav-btn{
  height:54px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:1rem;font-weight:700;transition:transform .18s var(--spring), filter .2s;
}
.nav-btn:active{transform:scale(.96)}
.nav-btn:hover{filter:brightness(1.06)}
.nav-btn.waze{background:var(--waze);color:var(--waze-ink)}
.nav-btn.gmaps{background:var(--gmaps-bg);color:var(--gmaps-ink)}
.nav-btn svg{width:24px;height:24px;flex:none}

/* Load sequence — one orchestrated moment */
.boot .card{opacity:0;transform:translateY(14px)}
.card.enter{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Empty */
.empty{text-align:center;padding:48px 24px;color:var(--ink-2)}
.empty .art{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-3)}
.empty .art svg{width:38px;height:38px}
.empty h3{color:var(--ink);font-size:1.15rem;font-weight:700;margin-bottom:6px}
.empty p{max-width:30ch;margin:0 auto}
.empty .btn{margin-top:18px}

.btn{height:48px;padding-inline:20px;border-radius:14px;font-weight:700;background:var(--blue);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}

/* =========================================================
   FOOTER CREDITS
   ========================================================= */
.credits{margin:38px 18px 8px;text-align:center}
.credits .rail{height:10px;margin:0 auto 16px;max-width:220px;
  background:
    linear-gradient(var(--line-strong),var(--line-strong)) 0 2px/100% 1.5px no-repeat,
    linear-gradient(var(--line-strong),var(--line-strong)) 0 7px/100% 1.5px no-repeat,
    repeating-linear-gradient(90deg, var(--line) 0 3px, transparent 3px 14px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}
.credits p{font-size:.84rem;color:var(--ink-3);letter-spacing:.01em}
.credits p b{color:var(--ink-2);font-weight:600}

/* =========================================================
   BOTTOM NAV + SOS FAB
   ========================================================= */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:40;width:100%;max-width:560px;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-top:1px solid var(--line);
}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);position:relative;height:56px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--ink-3);position:relative;z-index:1;transition:color .25s}
.tab[aria-selected="true"]{color:var(--ink)}
.tab .badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding-inline:5px;border-radius:9px;background:var(--blue);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.tab .badge:empty{display:none}
.tab-ind{position:absolute;top:4px;bottom:4px;width:calc(100% / 3);border-radius:16px;background:var(--panel-2);border:1px solid var(--line);transition:transform .45s var(--spring)}

.sos{
  position:fixed;z-index:45;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);
  inset-inline-end:max(18px, calc(50vw - 280px + 18px));
  height:60px;padding-inline:18px 22px;border-radius:30px;background:var(--sos);color:#fff;
  display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;
  box-shadow:0 12px 28px -8px rgba(229,36,46,.7);
  transition:transform .25s var(--spring);
}
.sos::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(229,36,46,.6);animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(229,36,46,.55)}70%,100%{box-shadow:0 0 0 18px rgba(229,36,46,0)}}
.sos:active{transform:scale(.93)}
.sos svg{width:24px;height:24px}
.sos.compact span{display:none}
.sos.compact{padding:0;width:60px;justify-content:center}

/* =========================================================
   BOTTOM SHEETS
   ========================================================= */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,8,18,.55);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:70;width:100%;max-width:560px;max-height:92dvh;
  transform:translate(-50%,105%);transition:transform .5s var(--ease);
  background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;border-top:1px solid var(--line-strong);
  display:flex;flex-direction:column;box-shadow:0 -20px 60px -20px rgba(0,0,0,.6);
}
.sheet.show{transform:translate(-50%,0)}
.sheet.dragging{transition:none}
.grab{padding:10px 0 6px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:44px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet-body{overflow-y:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}

.d-head{display:flex;gap:14px;align-items:flex-start}
.d-head .sig{width:30px;padding:6px 0;gap:6px}
.d-head .sig i{width:14px;height:14px}
.d-title{font-size:1.45rem;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.d-sub{color:var(--ink-2);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.d-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.d-actions .nav-btn{height:60px;font-size:1.05rem}

.section{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.section h3{font-size:.95rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:8px;justify-content:space-between}
.section h3 small{font-weight:500;color:var(--ink-3);font-size:.8rem}

/* Weather */
.wx{display:flex;align-items:center;gap:16px;margin-top:12px}
.wx-emoji{font-size:3rem;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.wx-temp{font-size:2.8rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.wx-desc{color:var(--ink-2);font-weight:500;margin-top:4px}
.wx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.wx-cell{background:var(--panel-2);border-radius:12px;padding:10px 6px;text-align:center}
.wx-cell b{display:block;font-size:1.02rem;font-weight:700}
.wx-cell span{font-size:.74rem;color:var(--ink-3);font-weight:500}
.adv{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.adv div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:.9rem;font-weight:500;line-height:1.35}
.adv .ok{background:rgba(54,224,138,.12)}
.adv .warn{background:rgba(255,194,61,.14)}
.adv .danger{background:rgba(255,90,95,.14)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--panel-2) 25%,var(--line-strong) 50%,var(--panel-2) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

.coord-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.coord{flex:1;font-size:1.05rem;font-weight:600;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
[dir="rtl"] .coord{text-align:right}
.mini-btn{height:40px;padding-inline:12px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.mini-btn svg{width:18px;height:18px}
.mini-btn:active{transform:scale(.95)}
.d-foot{display:flex;gap:10px;margin-top:18px}
.d-foot .btn{flex:1;justify-content:center}

/* Emergency sheet */
.e-title{font-size:1.4rem;font-weight:800}
.e-sub{color:var(--ink-2);margin-top:4px}
.e-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.e-item{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);
  text-decoration:none;color:inherit;transition:transform .2s var(--spring)
}
.e-item:active{transform:scale(.98)}
.e-item.primary{background:var(--sos);border-color:var(--sos);color:#fff}
.e-ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:none;font-size:1.3rem;font-weight:800;background:var(--panel-2)}
.e-item.primary .e-ico{background:rgba(255,255,255,.18)}
.e-txt{flex:1;min-width:0}
.e-txt b{display:block;font-size:1.06rem}
.e-txt span{font-size:.86rem;opacity:.8}
.e-num{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.e-item.disabled{opacity:.6}

/* Toast */
.toast{
  position:fixed;left:50%;z-index:90;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 94px);
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:.92rem;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:all .35s var(--spring);max-width:calc(100% - 36px);text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Theme switch cross-fade */
.theme-fade *{transition:background-color .4s var(--ease), border-color .4s var(--ease), color .3s var(--ease) !important}

@media (min-width:600px){
  .top{padding-top:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============ v2 additions ============ */
.tabs{grid-template-columns:repeat(4,1fr)}
.tab-ind{width:25%}
.sig.unset i{background:var(--lamp-off)}
.pill-km{display:inline-flex;align-items:center;height:26px;padding-inline:9px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;direction:ltr}
.c-note{display:flex;gap:7px;align-items:flex-start;margin-top:9px;font-size:.88rem;color:var(--ink-2);line-height:1.35}
.c-note svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--blue-hi)}
.meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.meta-row .status{margin-top:0}

.group-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 2px;font-size:.95rem;font-weight:700;color:var(--ink-2)}
.group-h small{font-weight:500;color:var(--ink-3)}
.unm-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border-radius:var(--r-lg);background:var(--panel);border:1px dashed var(--line-strong);text-align:start}
.unm-toggle b{display:block;font-size:1rem}
.unm-toggle span{font-size:.86rem;color:var(--ink-3)}
.unm-toggle svg{transition:transform .3s var(--ease);color:var(--ink-3)}
.unm-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;text-align:start}
button.row:active{background:var(--panel-2)}
.row .r-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--panel-2)}
.row .r-ico svg{width:20px;height:20px}
.row .r-body{flex:1;min-width:0}
.row .r-title{font-weight:700;font-size:1rem;line-height:1.25}
.row .r-title mark{background:rgba(59,139,255,.28);color:inherit;border-radius:4px;padding:0 2px}
.row .r-sub{font-size:.84rem;color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .chev{width:18px;height:18px;color:var(--ink-3);flex:none}
[dir="rtl"] .row .chev{transform:scaleX(-1)}
.d-id{font-weight:800;font-size:1.05rem;direction:ltr;unicode-bidi:isolate;letter-spacing:.01em}
.waze-mini{height:40px;padding-inline:12px;border-radius:11px;background:var(--waze);color:var(--waze-ink);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;flex:none}
.waze-mini svg{width:18px;height:18px}
.more{margin:6px auto 0;display:flex}
.dup{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,194,61,.14);font-size:.88rem;font-weight:500;display:flex;gap:8px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin-top:12px;font-size:.95rem}
.kv dt{color:var(--ink-3);font-weight:500}
.kv dd{font-weight:600;overflow-wrap:anywhere}
.big-km{font-size:2rem;font-weight:800;letter-spacing:-.02em;direction:ltr;font-variant-numeric:tabular-nums;margin-top:6px}
.ref-card{margin-top:12px}
.ref-card p{font-size:.88rem;color:var(--ink-2);margin-bottom:12px}
.ref-card .ref-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.02rem;margin-bottom:12px}

.st-set{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.st-set button{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);font-weight:600;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:8px}
.st-set button i{width:10px;height:10px;border-radius:50%;background:var(--lamp-off)}
.st-set button[data-v="safe"] i{background:var(--lamp-green)}
.st-set button[data-v="active"] i{background:var(--lamp-amber)}
.st-set button[data-v="clearance"] i{background:var(--lamp-red)}
.st-set button[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--ink)}
.sort{flex:none}.sort button{white-space:nowrap}.count{min-width:0}

/* lock */
.lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:var(--bg);opacity:0;transition:opacity .45s var(--ease)}
.lock.ready{opacity:1}
.lock.gone{opacity:0;pointer-events:none}
.lock-card{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.lock-sig{width:38px;height:74px;border-radius:19px;margin-bottom:6px}
.lock-sig i{width:16px;height:16px}
.lock h1{font-size:1.9rem;font-weight:800}
.lock p{color:var(--ink-2);max-width:32ch}
.lock input[type=password]{width:100%;height:58px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--panel);padding:0 18px;font-size:1.2rem;font-weight:600;letter-spacing:.12em;text-align:center;outline:none}
.lock input[type=password]:focus{border-color:var(--blue-hi);box-shadow:0 0 0 4px rgba(59,139,255,.2)}
.remember{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--ink-2);min-height:44px}
.remember input{width:20px;height:20px;accent-color:var(--blue)}
.lock .btn{width:100%;justify-content:center;height:54px;font-size:1.05rem}
.lock-err{min-height:1.3em;color:var(--lamp-red);font-weight:600;font-size:.92rem}
.lock-foot{font-size:.78rem !important;color:var(--ink-3) !important;margin-top:18px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* install bar */
.install{position:fixed;z-index:50;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 90px);
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line-strong);box-shadow:var(--shadow)}
.install[hidden]{display:none}
.install img{border-radius:11px;flex:none}
.install p{flex:1;font-size:.88rem;line-height:1.35}
.lock-out{margin-top:14px;min-height:44px;padding-inline:14px;font-size:.82rem;color:var(--ink-3);text-decoration:underline}
.hint{font-size:.8rem;color:var(--ink-3);margin-top:8px}
</style>
</head>

/* =========================================================
   CONFIGURATION
   ========================================================= */
const CONFIG = {

/* =========================================================
   STATE
   ========================================================= */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("rs:"+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("rs:"+k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  theme: store.get("theme", matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"),
  tab:"all", q:"", sector:"all", type:"all", dtype:"all",
  sort:"az", pos:null, page:1, showUnmapped:false,
  favs:new Set(store.get("favs",[])),
  recents:store.get("recents",[]),
  status:store.get("status",{}),
  open:null
};
const $ = s => document.querySelector(s);
const siteById = id => SITES.find(s => s.id === id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[\u0591-\u05C7'"׳״]/g,"").replace(/[–—\-_]/g," ").replace(/\s+/g," ").trim();
const coarse = matchMedia("(pointer: coarse)").matches;
const wxCache = new Map();


/* =========================================================
   HELPERS
   ========================================================= */
function haversine(a,b){
  const R=6371, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist = km => km<1 ? `${Math.round(km*1000)} מ׳` : `${km<10?km.toFixed(1):Math.round(km)} ק״מ`;
function ago(ts){
  const s=(Date.now()-ts)/1000;
  if(s<60) return "עכשיו"; if(s<3600) return `לפני ${Math.floor(s/60)} דק׳`;
  if(s<86400) return `לפני ${Math.floor(s/3600)} שע׳`; return `לפני ${Math.floor(s/86400)} ימים`;
}
function highlight(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
const qMatch = h => !S.q || norm(S.q).split(" ").every(w => h.includes(w));
let toastT;
function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2200); }
function haptic(ms=10){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
const icon = (id, cls="i", style="") => `<svg class="${cls}" ${style?`style="${style}"`:""}><use href="#${id}"/></svg>`;

/* =========================================================
   NAVIGATION HANDOFF
   ========================================================= */
function addRecent(id){ S.recents=[{id,t:Date.now()},...S.recents.filter(r=>r.id!==id)].slice(0,15); store.set("recents",S.recents); }
function launch(appUrl, webUrl){
  if(!coarse || !appUrl){ coarse ? location.href=webUrl : window.open(webUrl,"_blank","noopener"); return; }
  const start=Date.now(); let left=false;
  const onHide=()=>{ if(document.hidden) left=true; };
  document.addEventListener("visibilitychange",onHide);
  location.href=appUrl;
  setTimeout(()=>{ document.removeEventListener("visibilitychange",onHide);
    if(!left && !document.hidden && Date.now()-start<3000) location.href=webUrl; },1500);
}
function openWaze(s){
  addRecent(s.id); haptic(15); toast("פותח את Waze…");
  launch(`waze://?ll=${s.lat},${s.lng}&navigate=yes`, `https://waze.com/ul?ll=${s.lat},${s.lng}&navigate=yes`);
}
function openGMaps(s){
  addRecent(s.id); haptic(15); toast("פותח את Google Maps…");
  launch(null, `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=driving`);
}
function wazeSearch(q){
  haptic(10); toast("מחפש ב-Waze…");
  launch(`waze://?q=${encodeURIComponent(q)}`, `https://waze.com/ul?q=${encodeURIComponent(q)}`);
}

/* =========================================================
   QUERIES
   ========================================================= */
function sites(){
  let arr;
  if(S.tab==="fav") arr=SITES.filter(s=>S.favs.has(s.id));
  else if(S.tab==="recent") arr=S.recents.map(r=>siteById(r.id)).filter(Boolean);
  else arr=SITES.slice();
  arr=arr.filter(s=>(S.sector==="all"||s.sector===S.sector)&&(S.type==="all"||s.type===S.type)&&qMatch(s._h));
  if(S.tab!=="recent"){
    if(S.sort==="near"&&S.pos) arr.sort((a,b)=>haversine(S.pos,a)-haversine(S.pos,b));
    else arr.sort((a,b)=>a.name.localeCompare(b.name,"he",{numeric:true}));
  }
  return arr;
}
function unmapped(){
  return UNMAPPED.filter(u=>(S.type==="all"||u.type===S.type)&&S.sector==="all"&&qMatch(u._h));
}
function assets(){
  const all=[...ZONES,...DISC];
  let arr=all.filter(a=>(S.dtype==="all"||(S.dtype==="zone"?a.kind==="zone":a.kind==="disc"&&a.type===S.dtype))&&qMatch(a._h));
  if(S.sort==="near"&&S.pos){
    const d=a=>{ const r=a.ref&&siteById(a.ref); return r?haversine(S.pos,r):1e9; };
    arr.sort((a,b)=>d(a)-d(b));
  }
  return arr;
}

const sigHTML = st => `<span class="sig ${st?"":"unset"}" data-s="${st||""}" aria-hidden="true"><i></i><i></i><i></i></span>`;
const navBtns = id => `
  <button class="nav-btn waze" data-act="waze" data-id="${id}">${icon("i-waze","")}Waze</button>
  <button class="nav-btn gmaps" data-act="gmaps" data-id="${id}">${icon("i-gmaps","")}Google Maps</button>`;
function typeTag(t){ const T=TYPES[t]; return `<span class="type" style="color:${T.color}">${icon(T.icon)}</span><span>${T.label}</span>`; }

function cardHTML(s,i){
  const fav=S.favs.has(s.id), st=S.status[s.id];
  const rec=S.tab==="recent"?S.recents.find(r=>r.id===s.id):null;
  return `
  <article class="card" style="--i:${Math.min(i,10)}">
    <div style="display:flex;align-items:flex-start">
      <button class="card-main" data-act="open" data-id="${s.id}" aria-label="${esc(s.name)}">
        ${sigHTML(st)}
        <div class="c-body">
          <div class="c-title">${highlight(s.name,S.q)}</div>
          <div class="c-sub">${typeTag(s.type)}<span class="sep"></span><span>${SECTORS[s.sector]}</span></div>
          ${s.note?`<div class="c-note">${icon("i-info")}<span>${esc(s.note)}</span></div>`:""}
          <div class="meta-row">
            ${st?`<span class="status" data-s="${st}">${STATUS[st].label}</span>`:""}
            ${s.code?`<span class="pill-km">${esc(s.code)}</span>`:""}
            ${S.pos?`<span class="dist num" style="margin:0">${fmtDist(haversine(S.pos,s))} ממך</span>`:""}
            ${rec?`<span class="dist" style="margin:0">ניווט אחרון ${ago(rec.t)}</span>`:""}
          </div>
        </div>
      </button>
      <button class="fav" data-act="fav" data-id="${s.id}" aria-pressed="${fav}" aria-label="${fav?"הסרה מהמועדפים":"הוספה למועדפים"}" style="margin-top:10px;margin-inline-end:10px">${icon("i-star")}</button>
    </div>
    <div class="nav-row">${navBtns(s.id)}</div>
  </article>`;
}
function unmappedHTML(list){
  if(!list.length) return "";
  const open=S.showUnmapped||!!S.q;
  return `
  <div class="group-h" style="margin-top:26px"><span>ללא מיקום מדויק</span><small>${list.length}</small></div>

     ${icon("i-down")}</button>`}
  ${open?list.map(u=>`
    <div class="row">
      <span class="r-ico" style="color:${TYPES[u.type].color}">${icon(TYPES[u.type].icon)}</span>

    </div>`).join(""):""}`;
}
function assetRow(a,i){

function emptyHTML(kind){
  const map={
    search:["i-search","לא נמצאו תוצאות","נסו מילה אחרת או נקו את הסינון.",`<button class="btn" data-act="reset">ניקוי חיפוש וסינון</button>`],
    fav:["i-star","אין עדיין מועדפים","הקישו על הכוכב בכרטיס אתר כדי לשמור אותו כאן.",`<button class="btn ghost" data-act="browse">מעבר לכל האתרים</button>`],
    recent:["i-clock","אין ניווטים אחרונים","אתרים שתנווטו אליהם יופיעו כאן לגישה מהירה.",`<button class="btn ghost" data-act="browse">מעבר לכל האתרים</button>`]
  }[kind];
  return `<div class="empty"><div class="art">${icon(map[0])}</div><h3>${map[1]}</h3><p>${map[2]}</p>${map[3]}</div>`;
}
let lastAssets=[];
function render(animate){
  const list=$("#list"); const filtered=S.q||S.sector!=="all"||S.type!=="all"||S.dtype!=="all";
  if(S.tab==="disc"){
    lastAssets=assets();
    const shown=lastAssets.slice(0,S.page*CONFIG.PAGE);
    list.innerHTML = lastAssets.length
      ? shown.map(assetRow).join("") + (lastAssets.length>shown.length?`<button class="btn ghost more" data-act="more">הצגת ${Math.min(CONFIG.PAGE,lastAssets.length-shown.length)} נוספים</button>`:"")
      : emptyHTML("search");
    $("#count").innerHTML = lastAssets.length===ZONES.length+DISC.length
      ? `<b>${DISC_N}</b> מנתקים ו-<b>${ZONES.length}</b> אזורים נייטרליים` : `<b>${lastAssets.length}</b> תוצאות`;
  } else {
    const arr=sites();
    const un=S.tab==="all"?unmapped():[];
    let html=arr.map(cardHTML).join("");
    if(!arr.length && !un.length) html=emptyHTML(filtered?"search":(S.tab==="all"?"search":S.tab));
    html+=unmappedHTML(un);
    list.innerHTML=html;
    const total=S.tab==="fav"?S.favs.size:S.tab==="recent"?S.recents.length:SITES.length;
    $("#count").innerHTML = arr.length===total ? `<b>${arr.length}</b> אתרים ממופים` : `<b>${arr.length}</b> מתוך ${total} אתרים`;
  }
  if(animate) list.querySelectorAll(".card").forEach(c=>c.classList.add("enter"));
  $("#favBadge").textContent=S.favs.size||"";
}
function chips(key, entries, dot){
  return entries.map(([v,l])=>`<button class="chip" data-f="${key}" data-v="${v}" aria-pressed="${S[key]===v}">${v!=="all"&&dot?dot(v):""}${esc(l)}</button>`).join("");
}

const WX={0:["☀️","בהיר"],1:["🌤️","בהיר בעיקר"],2:["⛅","מעונן חלקית"],3:["☁️","מעונן"],45:["🌫️","ערפל"],48:["🌫️","ערפל"],
51:["🌦️","טפטוף קל"],53:["🌦️","טפטוף"],55:["🌧️","טפטוף כבד"],56:["🌧️","טפטוף קופא"],57:["🌧️","טפטוף קופא"],
61:["🌦️","גשם קל"],63:["🌧️","גשם"],65:["🌧️","גשם כבד"],66:["🌧️","גשם קופא"],67:["🌧️","גשם קופא"],
71:["🌨️","שלג קל"],73:["🌨️","שלג"],75:["❄️","שלג כבד"],77:["🌨️","פתיתי שלג"],80:["🌦️","ממטרים"],81:["🌧️","ממטרים"],82:["⛈️","ממטרים עזים"],
85:["🌨️","ממטרי שלג"],86:["🌨️","ממטרי שלג"],95:["⛈️","סופת ברקים"],96:["⛈️","סופת ברקים וברד"],99:["⛈️","סופת ברקים וברד"]};
async function getWeather(s,force){
  const c=wxCache.get(s.id);
  if(!force&&c&&Date.now()-c.t<CONFIG.WEATHER_TTL_MIN*60000) return c.d;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lng}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m,precipitation,is_day&wind_speed_unit=kmh&timezone=Asia%2FJerusalem`;
  const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),8000);
  try{ const r=await fetch(url,{signal:ctrl.signal}); if(!r.ok) throw 0; const d=(await r.json()).current; wxCache.set(s.id,{t:Date.now(),d}); return d; }
  finally{ clearTimeout(to); }
}
function advisories(w){
  const out=[], c=w.weather_code;
  if(c>=95) out.push(["danger","סופת ברקים באזור — אין לבצע עבודות על מערכת החשמול עד לחלוף הסופה."]);
  if(w.wind_gusts_10m>=38) out.push([w.wind_gusts_10m>=50?"danger":"warn",`משבי רוח של ${Math.round(w.wind_gusts_10m)} קמ״ש — סכנה בעבודה בגובה ובקרבת קווי המגע.`]);
  if(w.apparent_temperature>=33) out.push([w.apparent_temperature>=38?"danger":"warn",`עומס חום (${Math.round(w.apparent_temperature)}°) — הקפידו על שתייה, צל והפסקות.`]);
  if((w.precipitation>0||(c>=51&&c<=86))&&c<95) out.push(["warn","משקעים באזור — משטחים חלקלקים ושטח בוצי בדרכי הגישה."]);
  if(c===45||c===48) out.push(["warn","ערפל — ראות מופחתת בדרכי הגישה ובמסילה."]);
  if(!out.length) out.push(["ok","אין התראות מזג אוויר. תנאים תקינים לעבודה בשטח."]);
  const ic={ok:"✅",warn:"⚠️",danger:"⛔"};
  return out.map(([k,m])=>`<div class="${k}"><span aria-hidden="true">${ic[k]}</span><span>${esc(m)}</span></div>`).join("");
}
async function loadWeather(s,force){
  const box=$("#wxBox"); if(!box) return;
  box.innerHTML=`<div style="display:flex;gap:16px;align-items:center;margin-top:12px"><div class="skel" style="width:56px;height:56px;border-radius:16px"></div>
    <div style="flex:1;display:grid;gap:8px"><div class="skel" style="width:40%;height:26px"></div><div class="skel" style="width:60%"></div></div></div>
    <div class="wx-grid">${'<div class="skel" style="height:52px;border-radius:12px"></div>'.repeat(4)}</div>`;
  try{
    const w=await getWeather(s,force);
    if(S.open!==s.id) return;
    const inf=WX[w.weather_code]||["🌡️","—"];
    const em=(!w.is_day&&w.weather_code<=1)?"🌙":inf[0];
    $("#wxStamp").textContent="עודכן "+new Date(w.time).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
    box.innerHTML=`<div class="wx"><div class="wx-emoji" aria-hidden="true">${em}</div><div><div class="wx-temp num">${Math.round(w.temperature_2m)}°</div><div class="wx-desc">${inf[1]}</div></div></div>
      <div class="wx-grid">
        <div class="wx-cell"><b class="num">${Math.round(w.apparent_temperature)}°</b><span>מורגש</span></div>
        <div class="wx-cell"><b class="num">${Math.round(w.wind_speed_10m)}</b><span>רוח קמ״ש</span></div>
        <div class="wx-cell"><b class="num">${Math.round(w.wind_gusts_10m)}</b><span>משבים</span></div>
        <div class="wx-cell"><b class="num">${w.relative_humidity_2m}%</b><span>לחות</span></div>
      </div><div class="adv">${advisories(w)}</div>`;
  }catch(e){
    if(S.open!==s.id) return;
    box.innerHTML=`<div class="adv"><div class="warn"><span aria-hidden="true">📡</span><span>לא ניתן לטעון מזג אוויר. בדקו חיבור לרשת.</span></div></div>
      <button class="mini-btn" style="margin-top:10px" data-act="wxretry" data-id="${s.id}">${icon("i-refresh")}נסו שוב</button>`;
  }
}

let lastFocus=null;
function openSheet(){
  const el=$("#sheet"); lastFocus=document.activeElement;
  $("#scrim").classList.add("show"); el.style.transform="";
  requestAnimationFrame(()=>el.classList.add("show"));
  document.body.style.overflow="hidden"; el.querySelector(".sheet-body").scrollTop=0;
  setTimeout(()=>{ const f=el.querySelector("button,a"); f&&f.focus({preventScroll:true}); },400);
}
function closeSheet(){
  const el=$("#sheet"); if(!el.classList.contains("show")) return;
  el.classList.remove("show"); el.style.transform=""; S.open=null;
  $("#scrim").classList.remove("show"); document.body.style.overflow="";
  lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true});
  render(false);
}
function openSite(id){ S.open=id; siteSheet(id); if(!$("#sheet").classList.contains("show")) openSheet(); else $("#sheetBody").scrollTop=0; }

(function drag(){
  const sheet=$("#sheet"), grab=sheet.querySelector(".grab"); let y0=null, dy=0;
  grab.addEventListener("pointerdown",e=>{ y0=e.clientY; dy=0; sheet.classList.add("dragging"); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointermove",e=>{ if(y0==null) return; dy=Math.max(0,e.clientY-y0); sheet.style.transform=`translate(-50%, ${dy}px)`; });
  const end=()=>{ if(y0==null) return; y0=null; sheet.classList.remove("dragging"); if(dy>110) closeSheet(); else sheet.style.transform=""; };
  grab.addEventListener("pointerup",end); grab.addEventListener("pointercancel",end);
})();

document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const id=el.dataset.id, s=id&&siteById(id);
  switch(el.dataset.act){
    case "waze": openWaze(s); break;
    case "gmaps": openGMaps(s); break;
    case "open": openSite(id); break;
    case "asset": { S.open=null; assetSheet(lastAssets[+el.dataset.i]); openSheet(); break; }
    case "wsearch": wazeSearch(el.dataset.q); break;
    case "unm": S.showUnmapped=!S.showUnmapped; render(false); break;
    case "more": S.page++; render(false); break;
    case "fav": {
      const on=!S.favs.has(id); on?S.favs.add(id):S.favs.delete(id); store.set("favs",[...S.favs]); haptic(8);
      document.querySelectorAll(`.fav[data-id="${id}"]`).forEach(b=>{ b.setAttribute("aria-pressed",on); b.setAttribute("aria-label",on?"הסרה מהמועדפים":"הוספה למועדפים"); b.classList.remove("pop"); void b.offsetWidth; if(on) b.classList.add("pop"); });
      $("#favBadge").textContent=S.favs.size||""; toast(on?"נשמר במועדפים":"הוסר מהמועדפים");
      if(S.tab==="fav"&&!$("#sheet").classList.contains("show")) render(false);
      break;
    }
    case "setst": {
      const v=el.dataset.v; if(v) S.status[id]=v; else delete S.status[id];
      store.set("status",S.status); haptic(8); siteSheet(id); toast(v?`הסטטוס עודכן: ${STATUS[v].label}`:"הסטטוס נוקה"); break;
    }
    case "copy": {
      const t=`${s.lat}, ${s.lng}`;
      try{ await navigator.clipboard.writeText(t); }catch(err){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      toast("הקואורדינטות הועתקו"); haptic(8); break;
    }
    case "share": {
      const url=`https://waze.com/ul?ll=${s.lat},${s.lng}&navigate=yes`;
      const data={title:s.name,text:`${s.name} — ניווט ב-Waze`,url};
      if(navigator.share){ try{ await navigator.share(data); }catch(err){} }
      else { try{ await navigator.clipboard.writeText(`${data.text}\n${url}`); toast("הקישור הועתק"); }catch(err){} }
      break;
    }
    case "wxretry": loadWeather(s,true); break;
    case "reset": S.q=""; $("#q").value=""; $("#searchBox").classList.remove("has-text"); S.sector=S.type=S.dtype="all"; S.page=1; renderFilters(); render(true); break;
    case "browse": setTab("all"); break;
  }
});

  S[c.dataset.f]=c.dataset.v; S.page=1; haptic(5); renderFilters(); render(true);
});
$("#sort").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.sort==="near"&&!S.pos){ locate(); return; }
  S.sort=b.dataset.sort; S.page=1; moveSortPill(); render(true);
});
function locate(){
  if(!("geolocation" in navigator)){ toast("המכשיר לא תומך באיתור מיקום"); return; }
  toast("מאתר מיקום…"); $("#locBtn").classList.add("active");
  navigator.geolocation.getCurrentPosition(p=>{
    S.pos={lat:p.coords.latitude,lng:p.coords.longitude}; S.sort="near"; moveSortPill(); render(true); toast("המיון לפי מרחק פעיל");
  },()=>{ $("#locBtn").classList.remove("active"); toast("לא ניתן לקבל מיקום. אשרו גישה למיקום בהגדרות הדפדפן."); },
  {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
$("#locBtn").addEventListener("click",locate);
function setTab(tab){
  if(S.tab===tab) return;
  S.tab=tab; S.page=1; moveTabInd(); renderFilters(); moveSortPill(); render(true); haptic(5);
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
$("#themeBtn").addEventListener("click",()=>{ S.theme=S.theme==="dark"?"light":"dark"; store.set("theme",S.theme); applyTheme(true); });
$("#sosBtn").addEventListener("click",()=>{ haptic(20); S.open=null; sosSheet(); openSheet(); });

let lastY=0;
addEventListener("scroll",()=>{ const y=scrollY; $("#sosBtn").classList.toggle("compact",y>lastY&&y>120); lastY=y; },{passive:true});
const net=()=>$("#offline").classList.toggle("show",!navigator.onLine);
addEventListener("online",net); addEventListener("offline",net);
addEventListener("resize",moveSortPill);

/* =========================================================
   PWA: service worker, updates, install prompt
   ========================================================= */
let deferredInstall=null;
if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const ask=w=>{ toastAction("גרסה חדשה זמינה","עדכון",()=>w.postMessage("skip")); };
    if(reg.waiting&&navigator.serviceWorker.controller) ask(reg.waiting);
    reg.addEventListener("updatefound",()=>{ const w=reg.installing;
      w&&w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) ask(w); }); });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!reloaded){ reloaded=true; location.reload(); } });
}
function toastAction(msg,label,fn){
  const el=$("#toast"); el.innerHTML=`${esc(msg)} <button style="margin-inline-start:10px;font-weight:800;text-decoration:underline;color:inherit">${esc(label)}</button>`;
  el.style.pointerEvents="auto"; el.classList.add("show"); clearTimeout(toastT);
  el.querySelector("button").onclick=()=>{ el.classList.remove("show"); el.style.pointerEvents=""; fn(); };
}
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredInstall=e; showInstall(); });
addEventListener("appinstalled",()=>{ deferredInstall=null; $("#installBar").hidden=true; toast("האפליקציה הותקנה"); });
function showInstall(){
  if(standalone||store.get("installDismissed",false)) return;
  const bar=$("#installBar");
  $("#installText").innerHTML = deferredInstall
    ? "התקינו את האפליקציה למסך הבית לגישה מהירה, גם בלי קליטה."
    : `להתקנה: הקישו על ${icon("i-share","i","width:18px;height:18px;vertical-align:-3px")} <b>שיתוף</b> ואז על <b>הוספה למסך הבית</b>.`;
  $("#installGo").hidden=!deferredInstall;
  bar.hidden=false;
}
$("#installGo").addEventListener("click",async()=>{ if(!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; $("#installBar").hidden=true; });
$("#installX").addEventListener("click",()=>{ $("#installBar").hidden=true; store.set("installDismissed",true); });

/* =========================================================
   ACCESS LOCK — data is AES-GCM encrypted; the access code derives the key
   ========================================================= */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptData(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code.trim().toUpperCase()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function prepData(D){
  SITES=D.sites; UNMAPPED=D.unmapped; ZONES=D.zones; DISC=D.disc;
  SITES.forEach(s => s._h = norm([s.name, s.waze, s.note, s.code, TYPES[s.type].label, SECTORS[s.sector]].join(" ")));
  UNMAPPED.forEach(u => u._h = norm([u.name, u.note, TYPES[u.type].label].join(" ")));
  ZONES.forEach(z => { z.kind="zone"; z._h = norm([z.name, z.km, "ns neutral section ניוטרל סקשן", DTYPES.zone].join(" ")); });
  DISC.forEach(d => { d.kind="disc"; d._h = norm([d.id, d.km, d.km.replace("+","."), d.station, d.sec, d.line, d.fl, DTYPES[d.type]].join(" ")); });
  DISC_N=new Set(DISC.map(d=>d.id)).size;
  $("#subtitle").textContent=`${SITES.length} אתרים ממופים · ${DISC_N} מנתקים`;
}
async function unlock(code, remember, silent){
  try{
    prepData(await decryptData(code));
    if(remember) store.set("code",code); 
    $("#lock").classList.add("gone"); setTimeout(()=>$("#lock").remove(),500);
    start(); return true;
  }catch(e){
    if(!silent){ $("#lockErr").textContent="קוד שגוי. בדקו את הקוד ונסו שוב."; $("#lockForm").classList.remove("shake"); void $("#lockForm").offsetWidth; $("#lockForm").classList.add("shake"); haptic(40); }
    else store.set("code",null);
    return false;
  }
}
$("#lockForm").addEventListener("submit",async e=>{
  e.preventDefault(); const btn=$("#lockBtn"); btn.disabled=true; btn.textContent="בודק…";
  await unlock($("#code").value,$("#remember").checked,false);
  btn.disabled=false; btn.textContent="כניסה";
});
$("#lockOut").addEventListener("click",()=>{ store.set("code",null); location.reload(); });

/* =========================================================
   BOOT
   ========================================================= */
applyTheme(false); renderFilters(); moveTabInd(); net();
function start(){
  moveSortPill(); document.fonts&&document.fonts.ready.then(moveSortPill);
  setTimeout(showInstall,2500);
  const r=$("#lr"),a=$("#la"),g=$("#lg");
  const finish=()=>{ g.className="on-g"; r.className=a.className=""; $("#app").classList.remove("boot"); render(true); };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return finish();
  r.className="on-r";
  setTimeout(()=>{ r.className=""; a.className="on-a"; },380);
  setTimeout(finish,760);
}
(async()=>{
  const saved=store.get("code",null);
  if(!(saved && await unlock(saved,true,true))){ $("#lock").classList.add("ready"); setTimeout(()=>$("#code").focus(),350); }
})();
</script>
</body>
